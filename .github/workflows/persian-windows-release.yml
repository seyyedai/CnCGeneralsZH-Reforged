name: Persian Windows Release

on:
  push:
    branches:
      - feature/persian-rtl-text
    paths:
      - "GeneralsMD/Code/Libraries/Source/WWVegas/WW3D2/**"
      - "GeneralsMD/Code/Tests/test_ww3d2.cpp"
      - ".github/workflows/persian-windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out Persian RTL branch
        uses: actions/checkout@v4
        with:
          ref: feature/persian-rtl-text
          fetch-depth: 0

      - name: Build Release executable
        shell: pwsh
        run: |
          $env:ZHR_NO_ADDONS = "1"
          cmd /c "build.bat Release generals"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build renderer test
        shell: pwsh
        run: |
          cmake --build build64 --config Release --target test_ww3d2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run renderer test
        shell: pwsh
        run: |
          ctest --test-dir build64 -C Release -R "^test_ww3d2$" --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage executable and shipped renderer data
        shell: pwsh
        run: |
          if (!(Test-Path "GeneralsMD/Run/generals.exe")) {
            throw "Build completed without GeneralsMD/Run/generals.exe"
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "GeneralsMD/Run/generals.exe" artifacts/
          if (Test-Path "GeneralsMD/Run/dx11shaders.shipped") {
            Copy-Item "GeneralsMD/Run/dx11shaders.shipped" artifacts/
          }
          Set-Content -Path artifacts/BUILD-INFO.txt -Value @(
            "Zero Hour Reforged - Persian RTL experimental build"
            "Branch: feature/persian-rtl-text"
            "Configuration: Release x64"
            "Game data files are not included."
          )

      - name: Upload Release executable
        uses: actions/upload-artifact@v4
        with:
          name: generals-persian-rtl-windows-x64-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
